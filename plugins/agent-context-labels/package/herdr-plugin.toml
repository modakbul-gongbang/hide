# The manifest Hide's install kit links (docs/agent-hooks.md, "The install
# kit"). It is this plugin's own manifest without the [[build]] step: the kit
# ships the release binary beside it, so a machine with no checkout and no
# Rust toolchain runs the same watcher. `herdr plugin install` keeps using
# ../herdr-plugin.toml, which builds from the checkout. hide-kit's tests hold
# the two equal apart from that step.
id = "hide.agent-context-labels"
name = "Agent Context Labels"
version = "0.2.0"
description = "Compact task summaries, lifecycle, and interaction status for Codex and Claude Code panes"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

[[startup]]
command = ["/bin/sh", "scripts/start-watcher.sh"]

[[actions]]
id = "refresh-active-pane-task"
title = "Refresh active pane task"
description = "Re-derive the focused pane task from its initial session view"
command = ["/bin/sh", "scripts/refresh-active-pane-task.sh"]

# Two explicit actions rather than one flip: Herdr can dispatch a single
# keypress more than once, and repeating a flip lands on an arbitrary state.
[[actions]]
id = "enable-automatic-summaries"
title = "Enable automatic summaries"
description = "Turn on automatic task analysis requests"
command = ["/bin/sh", "scripts/enable-automatic-summaries.sh"]

[[actions]]
id = "disable-automatic-summaries"
title = "Disable automatic summaries"
description = "Turn off automatic task analysis requests while keeping attention symbols active"
command = ["/bin/sh", "scripts/disable-automatic-summaries.sh"]
