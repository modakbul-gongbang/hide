[package]
name = "agent-context-labels"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Compact task summaries and runtime status for Herdr coding-agent panes"

[lib]
name = "agent_context_labels"
path = "src/lib.rs"

[[bin]]
name = "hide-agent-context-labels"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
fs2 = "=0.4.3"
hide-ai = { path = "../../hide-ai" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"
