[package]
name = "hided"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hided"
path = "src/bin/hided.rs"

[[bin]]
name = "hide"
path = "src/bin/hide.rs"

[dependencies]
herdr-core = { path = "../herdr-core" }
hide-factory = { path = "../hide-factory" }
hide-host = { path = "../hide-host" }
hide-node = { path = "../hide-node" }
hide-node-link = { path = "../hide-node-link" }
hide-platform = { path = "../hide-platform" }
hide-kit = { path = "../hide-kit" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-session = { path = "../hide-session" }
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
hex = "=0.4.3"
getrandom = "=0.2.16"
libc = "=0.2.189"
tower-http = { version = "=0.6.8", features = ["fs"] }
base64 = "=0.23.1"
subtle = "=2.6.1"
cap-std = "=4.0.3"
percent-encoding = "=2.3.2"
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect"] }
futures-util = "=0.3.34"
# Web Push: VAPID signing and RFC 8291 encryption (ring), and the POST to the
# push service (ureq over rustls). Both are already in the build through
# hide-memory and herdr-core.
ring = "=0.17.14"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# A device pane's command stream arrives as bytes over its node link and is
# served as HTTP in process (`server::serve_link_connection`); axum already
# builds both.
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["service", "tokio"] }

[dev-dependencies]
tempfile = "=3.27.0"
# A link with no device behind it, for tests of what a link's identity decides.
hide-node = { path = "../hide-node", features = ["test-support"] }
anyhow = "=1.0.104"
hide-agent-hooks = { path = "../hide-agent-hooks" }
# The loopback SSH server of the device link's tests (tests/support).
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "service", "tokio"] }
tower = "=0.5.3"
