[package]
name = "hided"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hided"
path = "src/bin/hided.rs"

[[bin]]
name = "hide"
path = "src/bin/hide.rs"

[dependencies]
herdr-core = { path = "../herdr-core" }
axum = { version = "=0.8.8", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
hex = "=0.4.3"
getrandom = "=0.2.16"
libc = "=0.2.189"
tower-http = { version = "=0.6.8", features = ["fs"] }
base64 = "=0.23.1"
subtle = "=2.6.1"
ignore = "=0.4.33"
cap-std = "=4.0.3"

[dev-dependencies]
tempfile = "=3.27.0"
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect"] }
futures-util = "=0.3.31"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.19", features = ["client-legacy", "http1", "tokio"] }
tower = "=0.5.2"
