[workspace]
members = [
    "hide-agent-adapter",
    "herdr-core",
    "hide-herdr-client",
    "hide-host",
    "hide-kit",
    "hide-agent-hooks",
    "hide-ai",
    "hide-factory",
    "hide-memory",
    "hide-node",
    "hide-node-link",
    "hide-platform",
    "hide-project",
    "hide-session",
    "hided",
    "workspace-hack",
]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
# An agent worktree is built a few times and discarded, so an incremental
# cache never repays what it costs; what it does instead is grow one cache
# per worktree. See `Build Output Belongs To Its Worktree` in AGENTS.md.
incremental = false

# The workspace's own crates keep file and line tables, enough for a panic's
# backtrace, and leave out the rest of the debug info, which is most of what a
# debug build of them writes and links. Dependencies keep the default, so the
# builds CI has cached for them stay valid, except the SSH crates at the end.
# A crate added to `members` without an entry here builds with full debug
# info, which is only slower.
[profile.dev.package.herdr-core]
debug = "line-tables-only"

[profile.dev.package.hide-agent-hooks]
debug = "line-tables-only"

[profile.dev.package.hide-ai]
debug = "line-tables-only"

[profile.dev.package.hide-factory]
debug = "line-tables-only"

[profile.dev.package.hide-herdr-client]
debug = "line-tables-only"

[profile.dev.package.hide-host]
debug = "line-tables-only"

[profile.dev.package.hide-kit]
debug = "line-tables-only"

[profile.dev.package.hide-memory]
debug = "line-tables-only"

[profile.dev.package.hide-platform]
debug = "line-tables-only"

[profile.dev.package.hide-project]
debug = "line-tables-only"

[profile.dev.package.hide-session]
debug = "line-tables-only"

[profile.dev.package.hided]
debug = "line-tables-only"

[profile.dev.package.hide-agent-adapter]
debug = "line-tables-only"

# A device's node is installed and spoken to over SSH, and every byte of
# both goes through these crates' ciphers and packet code. Unoptimized they
# move a few MiB a second, so a debug build's own node, which is what a
# development daemon installs on a device, took longer to upload than the
# remote mailbox lane waits for a ready device. Optimizing them keeps a dev
# build's SSH as fast as a shipped one's for a few seconds more of build.
[profile.dev.package.russh]
opt-level = 3

[profile.dev.package.russh-sftp]
opt-level = 3

[profile.dev.package.russh-cryptovec]
opt-level = 3

[profile.dev.package.ssh-cipher]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.ctr]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3
