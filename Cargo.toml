[package]
name = "herdr-ide"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
autobins = false

[workspace]
members = [".", "herdr-core"]
resolver = "3"

[lib]
name = "herdr_ide"
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.100"
pollster = "=0.4.0"
portable-pty = "=0.9.0"
russh = { version = "=0.63.1", default-features = false, features = ["ring", "rsa"] }
russh-config = "=0.58.0"
russh-sftp = "=2.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.53.1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
[build-dependencies]
serde_json = "=1.0.145"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
