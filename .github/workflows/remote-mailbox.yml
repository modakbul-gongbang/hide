# The remote mailbox crate-boundary lane (hided/tests/remote_delivery.rs,
# docs/TESTING.md) as one reusable job: the candidate CLI binaries, two private
# pinned Herdr servers and a loopback SSH server. `pr.yml` runs it on Linux for
# a change to the crates it builds, and `nightly.yml` on macOS, the system of
# the usual remote device: the fixture signs its staged binaries there and
# serves SFTP from the system's own server.
name: remote mailbox lane

on:
  workflow_call:
    inputs:
      runner:
        description: The GitHub-hosted runner label.
        type: string
        required: true
      herdr-platform:
        description: The pinned Herdr asset to run, as `fetch-herdr-runtime.sh --platform` names it.
        type: string
        required: true

# `issues: write` is for filing a flaky test; a caller must grant it.
permissions:
  contents: read
  issues: write

jobs:
  mailbox:
    name: remote mailbox ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          workspaces: ". -> target"
          # Its own key: this build adds 48 dependencies the hided build does
          # not, and a cache saves only under a new key.
          shared-key: web-e2e-mailbox
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zsh and the SFTP server
        # The fixture starts every pane's shell from SHELL=/bin/zsh, and the
        # Herdr fetch script is zsh; the Linux image has neither. The helper
        # install needs the SFTP server the fixture's sshd serves. The mirror
        # can stall (web-e2e.yml), so apt retries and gives up on a silent
        # connection. macOS has both.
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          sudo apt-get install -y --no-install-recommends zsh openssh-sftp-server
      - name: Install cargo-nextest
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Build the CLI binaries
        # hided, hide, the agent hooks and the host helper: the lane stages and
        # starts all four.
        timeout-minutes: 20
        run: bash scripts/verify-cargo.sh cli
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        env:
          HERDR_PLATFORM: ${{ inputs.herdr-platform }}
        # Assigned first, so a failed fetch fails this step rather than
        # handing the next one an empty path.
        run: |
          bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Remote mailbox over private SSH
        timeout-minutes: 40
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
        run: |
          # TEMP EVIDENCE: repeat the test in parallel loops, no retries.
          worker() {
            w=$1; p=0; f=0
            for i in $(seq 1 6); do
              if bash scripts/verify-cargo.sh nextest --profile ci -p hided --test remote_delivery --run-ignored only --retries 0 >"run-$w-$i.log" 2>&1; then p=$((p+1)); else f=$((f+1)); cp "run-$w-$i.log" "agents/runs/fail-$w-$i.log" 2>/dev/null || true; fi
            done
            echo "WORKER $w pass=$p fail=$f"
          }
          bash scripts/verify-cargo.sh nextest --profile ci -p hided --test remote_delivery --run-ignored only --retries 0 --no-run >/dev/null 2>&1 || true
          for w in 1 2 3 4 5 6; do worker $w & done
          wait
          grep -h "Error: timed out" run-*.log | sort | uniq -c
          for f in run-*.log; do grep -q "1 passed" "$f" || { echo "== $f"; tail -n 30 "$f"; }; done
          ! ls run-*.log >/dev/null 2>&1 || ! grep -L "1 passed" run-*.log | grep -q .
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml
      - name: Keep the lane's run directory
        # The daemon's and both Herdr servers' logs behind a failed run, without
        # the staged binaries, the copies of them the install places in each
        # account's helper and bin folders, and the fixture's SSH keys.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-remote-mailbox-logs-${{ inputs.runner }}
          include-hidden-files: true
          path: |
            agents/runs/rd-*
            !agents/runs/rd-*/cli/**
            !agents/runs/rd-*/*/*/.ssh/**
            !agents/runs/rd-*/*/*/helper/**
            !agents/runs/rd-*/*/*/bin/**
          if-no-files-found: ignore
