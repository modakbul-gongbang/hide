name: Native design contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject style literals and duplicated components
        run: |
          node scripts/check-design-contract.mjs
          node --test scripts/tests/design-controls.test.mjs
