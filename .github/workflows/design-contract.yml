name: Design contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reject token literals and a Pen library out of step with tokens and the gallery
        run: |
          node scripts/check-design-contract.mjs
          node --test scripts/tests/pen-gallery.test.mjs
          node --test scripts/tests/pen-transplant.test.mjs
          node --test scripts/tests/design-scratch.test.mjs
