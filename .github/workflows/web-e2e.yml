# The web end-to-end suite as one reusable lane, so the pull request's Linux
# shards, its macOS `@platform` job and all three nightly OS lanes build, fetch and
# run the suite the same way and differ only in what they are asked here: the
# runner, which Herdr asset to run, how many shards deal the tests out, and
# which tests (`grep` and `full-suite`) to keep.
#
# Each spec starts its own Herdr, hided and Chromium, so one worker per runner
# keeps timing assertions honest; the shards are the parallelism.
#
# With more than one shard the daemon is built once, in the `build` job, and
# every shard downloads it to the path the fixtures read, `target/debug`. A
# single shard builds in place: a second job would only add its own setup.
name: web e2e lane

on:
  workflow_call:
    inputs:
      lane:
        description: Names the lane in job names and artifact names.
        type: string
        required: true
      runner:
        description: The GitHub-hosted runner label.
        type: string
        required: true
      herdr-platform:
        description: The pinned Herdr asset to run, as `fetch-herdr-runtime.sh --platform` names it.
        type: string
        required: true
      max-parallel:
        description: Trial capacity, keeping all shard tests and identities.
        type: number
        required: false
        default: 6
      ledger-lane:
        type: string
        required: false
        default: web-e2e
      shards:
        description: How many shards deal the tests out.
        type: number
        required: true
      grep:
        description: Playwright `--grep` filter; empty runs every test.
        type: string
        required: false
        default: ""
      full-suite:
        description: Include @flaky tests in the blocking suite (nightly only).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # Fans the shard numbers out as a matrix; a matrix cannot count to an input.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          MAX_PARALLEL: ${{ inputs.max-parallel }}
        run: |
          python3 - <<'PYPLAN'
          import json, os
          shards = int(os.environ['SHARDS'])
          if int(os.environ['MAX_PARALLEL']) not in (4, 6):
              raise ValueError('capacity trial must be 4 or 6')
          if not 1 <= shards <= 8:
              raise ValueError('shards must be between 1 and 8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('shards=' + json.dumps(list(range(1, shards + 1))) + '\n')
          PYPLAN

  # zsh for the Linux shards, fetched once. The Ubuntu mirror serves one
  # connection at about 60 kB/s when many runners ask at once (2026-10-01: 5 MB
  # of zsh took 88 s in every shard that asked), and a shard that stalled on it
  # held its slot until the job timeout. Here the fetch runs beside the cargo
  # build, retries, gives up on a silent connection after 30 s, and fails the
  # lane with its own name after 5 minutes.
  zsh:
    name: fetch zsh ${{ inputs.lane }}
    if: ${{ startsWith(inputs.runner, 'ubuntu') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Download the zsh packages
        timeout-minutes: 5
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          mkdir zsh-debs
          cd zsh-debs
          apt-get download zsh zsh-common
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: zsh-debs-${{ inputs.lane }}
          path: zsh-debs
          if-no-files-found: error
          retention-days: 1

  # One cargo build for the whole lane. The debug `hided` reads `web/dist` from
  # disk at run time, so the binaries are all a shard needs from cargo; the
  # `hide` CLI comes from the same package and `workspace-cli.spec.ts` runs it.
  build:
    name: build hided ${{ inputs.lane }}
    if: ${{ inputs.shards > 1 }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          workspaces: ". -> target"
          shared-key: web-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build hided for Playwright
        timeout-minutes: 20
        run: bash scripts/verify-cargo.sh build -p hided
      - name: Keep the binaries for the shards
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: hided-debug-${{ inputs.lane }}
          path: |
            target/debug/hided${{ runner.os == 'Windows' && '.exe' || '' }}
            target/debug/hide${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: web e2e ${{ inputs.lane }} ${{ matrix.shard }}/${{ inputs.shards }}
    needs: [plan, build, zsh]
    # `build` is skipped for a single shard and `zsh` off Linux; a failed or
    # cancelled one still stops the shards, and the lane reports the failure.
    if: ${{ !cancelled() && needs.plan.result == 'success' && ((inputs.shards > 1 && needs.build.result == 'success') || (inputs.shards == 1 && needs.build.result == 'skipped')) && ((startsWith(inputs.runner, 'ubuntu') && needs.zsh.result == 'success') || (!startsWith(inputs.runner, 'ubuntu') && needs.zsh.result == 'skipped')) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          version: 10
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        if: ${{ inputs.shards == 1 }}
        with:
          workspaces: ". -> target"
          shared-key: web-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build hided for Playwright
        if: ${{ inputs.shards == 1 }}
        timeout-minutes: 20
        run: bash scripts/verify-cargo.sh build -p hided
      - name: Fetch hided from the build job
        if: ${{ inputs.shards > 1 }}
        uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: hided-debug-${{ inputs.lane }}
          path: target/debug
      - name: Mark the binaries executable
        if: ${{ inputs.shards > 1 && runner.os != 'Windows' }}
        # An artifact does not keep the executable bit.
        run: chmod +x target/debug/hided target/debug/hide
      - name: Install web dependencies
        timeout-minutes: 5
        run: bash scripts/verify-web.sh install
      - name: Build the web shell
        timeout-minutes: 5
        run: bash scripts/verify-web.sh web build
      - name: Fetch zsh from the zsh job
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: zsh-debs-${{ inputs.lane }}
          path: zsh-debs
      - name: Install zsh
        if: runner.os == 'Linux'
        timeout-minutes: 3
        # Herdr starts each pane's shell from SHELL, and the fixture names zsh
        # so its private .zshrc sets the prompt the tests wait for. macOS has it.
        # The packages come from the `zsh` job, so no shard asks the mirror.
        run: sudo dpkg -i zsh-debs/*.deb
      - name: Install Playwright Chromium
        timeout-minutes: 5
        # No `--with-deps`: it runs apt, which stalled on the mirror, and the
        # runner image already carries the libraries Chromium needs. The suite
        # passes on it (2026-10-01 run 36896943318, no "missing dependencies"
        # from Playwright); `--with-deps` only added fonts and newer Mesa
        # builds. A launch failure names the missing library in the shard log.
        run: bash scripts/verify-web.sh web playwright-install
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        # The click-flow e2e attaches hided to an isolated real Herdr; the
        # fixture refuses any binary whose version is not the pin.
        env:
          HERDR_PLATFORM: ${{ inputs.herdr-platform }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          else
            bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: End-to-end
        timeout-minutes: 20
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
          CI_LEDGER_PATH: ${{ runner.temp }}/hide-e2e/ledger-${{ matrix.shard }}.json
          CI_SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          CI_LANE: ${{ inputs.ledger-lane }}
          CI_JOB_LABEL: web e2e ${{ inputs.lane }} ${{ matrix.shard }}/${{ inputs.shards }}
          HIDE_E2E_TRACE: "1"
          GREP: ${{ inputs.grep }}
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          FULL_SUITE: ${{ inputs.full-suite }}
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          args=(--shard="$SHARD")
          if [ "$FULL_SUITE" != true ]; then
            python3 scripts/ci-quarantine.py filter --suite web --mode exclude --os "$RUNNER_OS" --output "$RUNNER_TEMP/quarantine-list.txt"
            args+=(--test-list-invert "$RUNNER_TEMP/quarantine-list.txt")
          fi
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          bash scripts/verify-web.sh web e2e "${args[@]}"
      - name: Keep the e2e run's logs
        # The daemon, Herdr server and PTY input logs behind a failed flow
        # (with the screenshots the specs take, under the same directory),
        # and Playwright's own test-results: with no screenshot or trace
        # option set that is the error-context page snapshot. The wire trace
        # is on the step's stdout. A screen assertion alone cannot say which
        # side moved.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hide-web-e2e-logs-${{ inputs.lane }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/hide-e2e
            web/test-results
          if-no-files-found: error
          retention-days: 14
      - name: Keep normalized attempts separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-ledger-web-${{ inputs.lane }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/hide-e2e/ledger-${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: error
