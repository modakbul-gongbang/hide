name: herdr pin update

# GitHub delivers no event across repository boundaries, so an upstream Herdr
# release cannot trigger this. It polls instead, and can be run by hand.
#
# This repository is public, so GitHub disables a scheduled workflow after 60
# days with no repository activity. If this job stops appearing, re-enable it
# in the Actions tab rather than looking for a bug here.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: herdr-pin-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the newest stable Herdr release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The releases/latest endpoint excludes prereleases, which is what
          # keeps the preview-* tags out of this proposal.
          latest_tag=$(gh api repos/herdrdev/herdr/releases/latest --jq .tag_name)
          latest=${latest_tag#v}
          pinned_tag=$(jq -er .tag macos/Sources/HerdrMacOS/Resources/herdr-bundle.json)
          pinned=$(jq -er .version macos/Sources/HerdrMacOS/Resources/herdr-bundle.json)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          # A preview pin reports "0.8.2-preview.<date>-<sha>": newer than the
          # 0.8.2 stable it was cut after, older than a 0.8.3 stable. Comparing
          # only the numeric prefix, and proposing only a strictly newer
          # stable, is what stops a weekly proposal to move back to 0.8.2.
          pinned_numeric=${pinned%%-*}
          highest=$(printf '%s\n%s\n' "$pinned_numeric" "$latest" | sort -V | tail -n 1)
          if [ "$latest_tag" = "$pinned_tag" ] || [ "$highest" = "$pinned_numeric" ]; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record a tick that found nothing
        if: steps.upstream.outputs.needs_bump == 'false'
        run: |
          set -euo pipefail
          # A poll that found no release is an outcome, not a silent success.
          echo "herdr.pin.current pinned=${{ steps.upstream.outputs.pinned }}" >&2
          echo "Herdr pin is current at ${{ steps.upstream.outputs.pinned }}; nothing proposed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when a proposal is already open
        id: existing
        if: steps.upstream.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="herdr-bump/v${{ steps.upstream.outputs.latest }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # The schedule fires again long before a bump gets reviewed, so the
          # second run must find the first one's PR instead of duplicating it.
          open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "herdr.pin.proposal_open branch=$branch" >&2
            echo "A bump PR for v${{ steps.upstream.outputs.latest }} is already open." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the pin, regenerate the contract and keep the verified binary
        if: steps.existing.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          zsh scripts/bump-herdr.sh --repo herdrdev/herdr "${{ steps.upstream.outputs.latest_tag }}" \
            --keep-binary "$RUNNER_TEMP/herdr"

      - name: Check the API schema against the candidate CLI
        if: steps.existing.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Only the schema half is portable. The snapshot, protocol and
          # server-version checks need a live Herdr session and stay local.
          zsh scripts/check-herdr-contract.sh --herdr-bin "$RUNNER_TEMP/herdr" --schema-only

      - name: Confirm the pin has one source
        if: steps.existing.outputs.proceed == 'true'
        run: zsh scripts/check-herdr-pin-single-source.sh

      - name: Run the Rust suite against the candidate
        if: steps.existing.outputs.proceed == 'true'
        run: cargo test --manifest-path herdr-core/Cargo.toml

      - name: Build the core the Swift package links
        if: steps.existing.outputs.proceed == 'true'
        # The Swift package links target/release/libherdr_core.a as a system
        # library, and cargo test leaves only a debug build behind.
        run: cargo build --release --locked -p herdr-core

      - name: Run the Swift suite against the candidate
        if: steps.existing.outputs.proceed == 'true'
        run: swift test --package-path macos

      - name: Open the pull request
        if: steps.existing.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.existing.outputs.branch }}"
          latest="${{ steps.upstream.outputs.latest }}"
          pinned="${{ steps.upstream.outputs.pinned }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add \
            macos/Sources/HerdrMacOS/Resources/herdr-bundle.json \
            contracts/herdr-api.schema.json \
            macos/Resources/THIRD_PARTY_NOTICES/herdr-APACHE-2.0.txt \
            README.md \
            docs/INSTALL.md
          git commit -m "Move the bundled Herdr pin to v${latest}"
          git push --set-upstream origin "$branch"
          cat > "$RUNNER_TEMP/pr-body.md" <<BODY
          Moves the pinned Herdr runtime from v${pinned} to v${latest}.

          The asset was downloaded, its reported version and SHA-256 verified, the
          contract regenerated from the schema that binary reports, and the manifest
          plus every document quoting the pin updated from that one source.

          Checks that ran here:

          - \`check-herdr-contract.sh --schema-only\` against the v${latest} CLI
          - \`check-herdr-pin-single-source.sh\`
          - \`cargo test\` and \`swift test\`

          What this does not prove, and why this is not merged automatically:

          The core carries behavior assumptions about a specific Herdr build - that
          \`pane.close\` removes an emptied tab without a separate event
          (\`session_sync.rs\`), that \`terminal.scroll\` publishes no new attach frame on
          its own (\`live.rs\`), and the tab reorder ordering a live server was observed
          to answer with (\`runtime.rs\`). Every test covering those feeds fixtures this
          repository wrote, so a green suite says the code is self-consistent, not that
          v${latest} still behaves that way.

          Before merging, run \`scripts/check-herdr-contract.sh\` in full against a live
          v${latest} server and exercise the tab, scroll and reorder paths.
          BODY
          gh pr create \
            --title "Move the bundled Herdr pin to v${latest}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          echo "Opened a bump proposal for v${latest}." >> "$GITHUB_STEP_SUMMARY"
