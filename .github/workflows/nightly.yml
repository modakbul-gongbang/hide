# Full web and desktop suites and package checks on all three OSes nightly,
# and `verify` (pr.yml) with every lane on main: a push to main that the merge
# queue verified runs no lane, so this run is the net under a lane a pull
# request's plan left out, and it saves main's caches after a runner image
# changes the toolchain.
# A test fails this run only when it fails its retry too (CI retries a failed
# test once); a test that passes the retry is flaky, and
# scripts/ci-flaky-report.py files it as an issue, as in pr.yml.
# Runner windows and Linux Xvfb exercise automation, not physical IME/device QA.
# PRs run the whole web suite on Linux and its `@platform` tests on Windows (see pr.yml); macOS runs only here.
# A main-branch nightly failure opens one issue or comments on the existing
# thread once per run attempt. Candidate-branch runs never write an issue.
# Run it by hand from the Actions tab (workflow_dispatch); actual queue load
# and completed jobs must be measured separately from this configured matrix.
# A hand run picks `lane`: `all`, or one system's web and desktop suites, so
# checking Windows does not occupy the macOS runners (one full dispatch used 7
# macOS jobs for 65 minutes). `verify` and `package` run for
# `all` only.
# The schedule runs everything. A lane left out is skipped, and the failure
# report ignores a skipped job.
#
# This repository is public, so GitHub disables a scheduled workflow after 60
# days with no repository activity. If this run stops appearing, re-enable it in
# the Actions tab rather than looking for a bug here.
name: nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Which system's suites to run by hand
        type: choice
        options: [all, linux, macos, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  web-e2e-linux:
    name: web e2e (Linux full)
    if: ${{ inputs.lane != 'macos' && inputs.lane != 'windows' }}
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      lane: nightly-linux
      runner: ubuntu-latest
      herdr-platform: linux-x86_64
      shards: 6

  web-e2e-macos:
    name: web e2e (macOS full)
    if: ${{ inputs.lane != 'linux' && inputs.lane != 'windows' }}
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      lane: nightly-macos
      runner: macos-15
      herdr-platform: macos-aarch64
      shards: 4

  web-e2e-windows:
    name: web e2e (Windows full)
    if: ${{ inputs.lane != 'linux' && inputs.lane != 'macos' }}
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      lane: nightly-windows
      runner: windows-latest
      herdr-platform: windows-x86_64
      shards: 4

  # The remote mailbox lane on macOS, the system of the usual remote device;
  # a pull request runs it on Linux. The OS contract's three legs run in
  # `verify` below, which plans every lane.
  remote-mailbox-macos:
    name: remote mailbox (macOS)
    if: ${{ inputs.lane != 'linux' && inputs.lane != 'windows' }}
    uses: ./.github/workflows/remote-mailbox.yml
    permissions:
      contents: read
      issues: write
    with:
      runner: macos-15
      herdr-platform: macos-aarch64

  desktop-e2e:
    name: desktop e2e (${{ matrix.system }} full)
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # One system by hand, all three otherwise; the runner and the Herdr
        # platform follow from the system.
        system: ${{ fromJSON(inputs.lane == 'linux' && '["linux"]' || inputs.lane == 'macos' && '["macos"]' || inputs.lane == 'windows' && '["windows"]' || '["linux","macos","windows"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zsh and the virtual display on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends zsh xvfb
      - name: Build the desktop app's daemon and kit binaries
        timeout-minutes: 20
        run: bash scripts/verify-cargo.sh cli
      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/verify-web.sh install
      - name: Install the pinned Electron runtime
        timeout-minutes: 5
        run: bash scripts/verify-web.sh desktop electron-install
      - name: Build the web shell
        timeout-minutes: 5
        run: |
          bash scripts/verify-web.sh web build
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: bash scripts/verify-web.sh desktop playwright-install
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        env:
          HERDR_PLATFORM: ${{ fromJSON('{"linux":"linux-x86_64","macos":"macos-aarch64","windows":"windows-x86_64"}')[matrix.system] }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          else
            bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Compare the binary schema and version with the pin
        run: python3 scripts/check-herdr-schema.py --herdr-bin "${{ steps.herdr.outputs.bin }}"
      - name: Whole desktop suite
        timeout-minutes: 20
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash scripts/verify-web.sh desktop e2e
          else
            bash scripts/verify-web.sh desktop e2e
          fi
      - name: Report flaky tests
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          python3 scripts/ci-flaky-report.py --suite desktop --playwright desktop/e2e-report.json || status=$?
          python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml || status=$?
          exit "$status"
      - name: Keep the failed desktop run
        # A flaky run keeps it as a failed one does; see web-e2e.yml.
        if: ${{ failure() || steps.flaky.outputs.flaky == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-nightly-desktop-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/hide-e2e
            desktop/test-results
          if-no-files-found: ignore

  verify:
    name: verify
    if: ${{ inputs.lane == '' || inputs.lane == 'all' }}
    uses: ./.github/workflows/pr.yml
    # pr.yml's jobs file a flaky test, and its plan job reads the Actions API.
    permissions:
      contents: read
      issues: write
      actions: read
  package:
    name: package
    if: ${{ inputs.lane == '' || inputs.lane == 'all' }}
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.0-nightly.${{ github.run_number }}
      include-macos: true

  report:
    name: report a failure
    needs: [web-e2e-linux, web-e2e-macos, web-e2e-windows, remote-mailbox-macos, desktop-e2e, verify, package]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Report each failed attempt once in the nightly issue
        uses: actions/github-script@v8
        env:
          NIGHTLY_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const report = require('./scripts/nightly-report.cjs');
            const outcome = await report({ github, context, results: JSON.parse(process.env.NIGHTLY_RESULTS) });
            core.info(JSON.stringify(outcome));
