# The `@platform` web tests on macOS and Windows, the desktop suite whole on
# macOS and its `@platform` tests on Linux and Windows, and package checks nightly,
# and `verify` (pr.yml) with every lane on main. A push to main runs every lane
# too, but a lane it fails opens no issue; here it opens a nightly-failure
# issue, and a lane that breaks with no merge (a runner image, a service a test
# reaches) is found within a day. The Rust toolchain is not one of those: its version is
# the one `rust-toolchain.toml` names, so a new image cannot change it.
# A test fails this run only when it fails its retry too (CI retries a failed
# test once); a test that passes the retry is flaky, and
# scripts/ci-flaky-report.py files it as an issue, as in pr.yml. A test that
# fails its retry too is written as a `Failed test` annotation on its job.
# Runner windows and Linux Xvfb exercise automation, not physical IME/device QA.
# PRs run the whole web suite on Linux and its `@platform` tests on Windows (see pr.yml); macOS runs only here.
# The `report` job, the one writer of `nightly-failure` issues, opens one per
# annotated test, or per lane and failed step for a failed job that annotated
# none (`infra` when that step only prepares the runner), with the candidate
# pull requests merged since the lane's last green nightly and a two-day
# expiry; it comments once per run attempt on an issue already open for the
# same failure, opens at most 10 per run and lists the rest in one, and
# closes a lane's issues when a scheduled run (or a hand run of `all`) passes
# it. A run of any other branch writes no issue. docs/TESTING.md, "Nightly
# failures", owns the policy.
# Run it by hand from the Actions tab (workflow_dispatch); actual queue load
# and completed jobs must be measured separately from this configured matrix.
# A hand run picks `lane`: `all`, or one system's web and desktop suites, so
# checking Windows does not occupy the macOS runners (one full dispatch used 7
# macOS jobs for 65 minutes). `verify` and `package` run for
# `all` only.
# The schedule runs everything. A lane left out is skipped, and the failure
# report ignores a skipped job.
#
# The schedule is at 17 past the hour: GitHub delays runs scheduled on the
# hour, when every repository's are due, and the 18:00 UTC run started
# between 22:30 and 23:50 UTC.
#
# This repository is public, so GitHub disables a scheduled workflow after 60
# days with no repository activity. If this run stops appearing, re-enable it in
# the Actions tab rather than looking for a bug here.
name: nightly

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Which system's suites to run by hand
        type: choice
        options: [all, linux, macos, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # macOS and Windows run the web tests tagged `@platform`, as the pull
  # request's platform lanes do: what differs by system is checked there, and
  # the rest of the suite is the same code on every system, which the pull
  # request and the `verify` job below already run whole on
  # Linux, so Linux has no web job here. What this run adds is the desktop app
  # on Linux and Windows, the packages, and a runner image that changed.
  web-e2e-macos:
    name: web e2e (macOS @platform)
    if: ${{ inputs.lane != 'linux' && inputs.lane != 'windows' }}
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      lane: nightly-macos
      runner: macos-15
      herdr-platform: macos-aarch64
      shards: 1
      grep: "@platform"

  web-e2e-windows:
    name: web e2e (Windows @platform)
    if: ${{ inputs.lane != 'linux' && inputs.lane != 'macos' }}
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      lane: nightly-windows
      runner: windows-latest
      herdr-platform: windows-x86_64
      shards: 1
      grep: "@platform"

  # The remote mailbox lane on macOS, the system of the usual remote device;
  # a pull request runs it on Linux. The OS contract's three legs run in
  # `verify` below, which plans every lane.
  remote-mailbox-macos:
    name: remote mailbox (macOS)
    if: ${{ inputs.lane != 'linux' && inputs.lane != 'windows' }}
    uses: ./.github/workflows/remote-mailbox.yml
    permissions:
      contents: read
      issues: write
    with:
      runner: macos-15
      herdr-platform: macos-aarch64

  # The whole desktop suite runs on macOS, the system the desktop app is written
  # against. Linux and Windows run only the tests tagged `@platform`: what the
  # desktop host does differently on that system (its processes and local
  # stream, whether closing the last window ends the app, the CLI's name and
  # places, the path it hands the wire, the file manager's reveal, its
  # accelerators). A test that checks no such difference stays on macOS.
  desktop-e2e:
    name: desktop e2e (${{ matrix.system }} ${{ matrix.system == 'macos' && 'full' || '@platform' }})
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # One system by hand, all three otherwise; the runner and the Herdr
        # platform follow from the system.
        system: ${{ fromJSON(inputs.lane == 'linux' && '["linux"]' || inputs.lane == 'macos' && '["macos"]' || inputs.lane == 'windows' && '["windows"]' || '["linux","macos","windows"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zsh and the virtual display on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends zsh xvfb
      - name: Build the desktop app's daemon and kit binaries
        timeout-minutes: 20
        run: bash scripts/verify-cargo.sh cli
      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/verify-web.sh install
      - name: Install the pinned Electron runtime
        timeout-minutes: 5
        run: bash scripts/verify-web.sh desktop electron-install
      - name: Build the web shell
        timeout-minutes: 5
        run: |
          bash scripts/verify-web.sh web build
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: bash scripts/verify-web.sh desktop playwright-install
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        env:
          HERDR_PLATFORM: ${{ fromJSON('{"linux":"linux-x86_64","macos":"macos-aarch64","windows":"windows-x86_64"}')[matrix.system] }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          else
            bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Compare the binary schema and version with the pin
        run: python3 scripts/check-herdr-schema.py --herdr-bin "${{ steps.herdr.outputs.bin }}"
      - name: Desktop suite (the whole suite on macOS, the @platform tests elsewhere)
        timeout-minutes: 20
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          selection=()
          if [ "$RUNNER_OS" != macOS ]; then
            selection=(--grep @platform)
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash scripts/verify-web.sh desktop e2e "${selection[@]}"
          else
            bash scripts/verify-web.sh desktop e2e "${selection[@]}"
          fi
      - name: Report flaky and failed tests
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        # One report per step: the step's annotations are its failed tests,
        # and GitHub keeps 10 per step.
        run: python3 scripts/ci-flaky-report.py --suite desktop --playwright desktop/e2e-report.json
      - name: Keep the failed desktop run
        # A flaky run keeps it as a failed one does; see web-e2e.yml.
        if: ${{ failure() || steps.flaky.outputs.flaky == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-nightly-desktop-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/hide-e2e
            desktop/test-results
          if-no-files-found: ignore

  verify:
    name: verify
    if: ${{ inputs.lane == '' || inputs.lane == 'all' }}
    uses: ./.github/workflows/pr.yml
    # pr.yml's jobs file a flaky test.
    permissions:
      contents: read
      issues: write
  package:
    name: package
    if: ${{ inputs.lane == '' || inputs.lane == 'all' }}
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.0-nightly.${{ github.run_number }}
      include-macos: true

  report:
    name: nightly report
    needs: [web-e2e-macos, web-e2e-windows, remote-mailbox-macos, desktop-e2e, verify, package]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Open, comment on and close the nightly-failure issues
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_INPUT: ${{ inputs.lane }}
        run: python3 scripts/ci-flaky-report.py --nightly --lane-input "$LANE_INPUT"
