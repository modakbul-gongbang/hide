# Every pull request and every push to main runs the same required lanes, and the
# single `verify` job is what branch protection requires. Adding a lane means
# adding it to `verify`'s `needs`; the protection rule never changes.
#
# Each gate here has a local command in CONTRIBUTING.md under "CI gates".
#
# Runner placement is a capacity decision. This organization's plan runs five
# macOS jobs at a time across every repository, and on 2026-09-28 one run held
# all five for 26 minutes, so a second pull request waited up to 70 minutes
# before its lanes started. A run therefore uses two macOS jobs: the Electron
# end-to-end and the web end-to-end's `@platform` tests, the ones that touch
# what differs by operating system (Trash, process ownership, file watching and
# saving, worktree paths, terminal input, ⌘ chords and Korean input).
# Everything else runs on Linux: the Rust suite, the unit suites, the invariant
# checks and the whole web end-to-end, dealt out to six shards by
# `web-e2e.yml`. `nightly.yml` runs the whole web end-to-end on macOS, so the
# move costs no macOS coverage, only its delay. On Windows, `windows check`
# compiles the workspace and runs the daemon's and the app's suites there,
# beside the OS contract's Windows leg (issue #293).
#
# Every job and every long step has a timeout a few times its usual length
# (measured over the 2026-09-29..10-01 runs): an hcoord end-to-end step that
# usually takes two minutes hung for 48 and for 156 in two runs, holding a
# required check, and a job without a timeout runs for six hours.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # A cache per pull request ref pushed the repository past the 10 GB
          # cache limit and evicted main's; main's is the one every run reads.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The ubuntu image ships rustfmt and Clippy with its Rust toolchain.
      # Every lane covers the whole Rust workspace.
      - name: Check formatting and lint the workspace
        run: bash scripts/verify-cargo.sh lint
      - name: Test the workspace
        # hide-ai drives its codex backend against a python fake app server.
        run: bash scripts/verify-cargo.sh test

  checks:
    name: checks and unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install zsh
        # The invariant scripts and the Herdr fetch are zsh; the image has bash.
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Test performance measurement semantics
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test nightly failure reporting
        run: node --test scripts/tests/nightly-report.test.cjs
      - name: Structural checks
        run: |
          bash scripts/check-harness-ignore-anchor.sh
          bash scripts/check-agent-asset-committed.sh
          bash scripts/check-capability-readers-off-lock.sh
          bash scripts/check-no-workstation-identity.sh
          bash scripts/check-worktree-removal-boundary.sh
          zsh scripts/check-herdr-pin-single-source.sh
      - name: Fetch the pinned Herdr runtime
        id: herdr
        # The manifest is the pin; the script verifies the download against
        # the manifest's digest before the binary answers anything. This lane
        # is the one place the release's Linux asset is run.
        run: |
          bin=$(zsh scripts/fetch-herdr-runtime.sh --platform linux-x86_64)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Compare the Herdr API schema with the contract
        run: python3 scripts/check-herdr-schema.py --herdr-bin "${{ steps.herdr.outputs.bin }}"
      - name: Install dependencies
        run: bash scripts/verify-web.sh install
      - name: hcoord typecheck, build, unit test, and end-to-end test
        timeout-minutes: 10
        run: |
          bash scripts/verify-web.sh hcoord typecheck
          bash scripts/verify-web.sh hcoord build
          bash scripts/verify-web.sh hcoord test
          bash scripts/verify-web.sh hcoord test:e2e
      - name: Web shell typecheck, lint, unit test, and build
        run: |
          bash scripts/verify-web.sh web typecheck
          bash scripts/verify-web.sh web lint
          bash scripts/verify-web.sh web test
          bash scripts/verify-web.sh web build
      - name: Desktop app typecheck, lint, and unit test
        # The menu is built from the web registry, so a registry change is
        # typechecked and tested here too.
        run: |
          bash scripts/verify-web.sh desktop typecheck
          bash scripts/verify-web.sh desktop lint
          bash scripts/verify-web.sh desktop test

  # What differs on Windows (issue #293), as a required lane: the whole
  # workspace compiles for Windows, hided's pane bootstrap and end-to-end
  # tests pass there, `hide connect` starts and `hide stop` ends the hided
  # beside it (what the desktop app does first), the agent hook entries run
  # through PowerShell as Claude Code and Codex run them, hided drives the
  # pinned Herdr for Windows (a pane opened through `/ws` and a typed line
  # echoed back), the web and desktop unit suites and the same browser
  # `@platform` smoke used on macOS. Before that browser step was added,
  # warm-cache jobs took 4-8 minutes on 2026-10-03; the new job's runtime
  # must be measured, and a cold run compiles the workspace from nothing.
  windows-check:
    name: windows check
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        # The runner converts to CRLF by default, which would make the unit
        # suites report line endings instead of code.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the workspace for Windows
        run: bash scripts/verify-cargo.sh check --workspace --all-targets --keep-going --message-format short
      - name: hided's pane bootstrap, file opener, the device's workspace bridge, the CLI's daemon start and end-to-end tests
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh test-scoped -p hided --lib -- pane_auth opener open_command workspace_cli
          bash scripts/verify-cargo.sh test-scoped -p hided --test opener_lifecycle
          bash scripts/verify-cargo.sh test-scoped -p hide-host --lib workspace_bridge
          bash scripts/verify-cargo.sh test-scoped -p hided --test connect_stop
          bash scripts/verify-cargo.sh test-scoped -p hided --test handshake
      - name: Install kit and its Windows command shim
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh test-scoped -p hide-kit
      - name: Agent hooks, their Windows entries run through PowerShell
        # The hook file writer, the entries Claude Code and Codex run on
        # Windows, and the helper's stdin deadline. It stands on its own, so
        # it runs whatever the step above answered.
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: bash scripts/verify-cargo.sh test-scoped -p hide-agent-hooks
      - name: Fetch the pinned Herdr runtime
        id: herdr
        # The proof below stands on its own, so it runs whatever the step
        # above answered.
        if: ${{ !cancelled() }}
        # Assigned first, so a failed fetch fails this step rather than
        # handing the next one an empty path.
        run: |
          bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: hided against the pinned Herdr
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' }}
        timeout-minutes: 10
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
        run: bash scripts/verify-cargo.sh test-scoped -p hided --test real_herdr -- --ignored --nocapture
      - name: Attribute a native listening port to its working directory
        # Cleanup must refuse an unreadable in-use check. This unchanged core
        # contract exposes the native read reason that a browser error lacks.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          status=0
          bash scripts/verify-cargo.sh test-scoped -p herdr-core --lib ports::tests::a_real_listener_is_found_and_attributed_to_the_directory_it_runs_in -- --exact --nocapture || status=$?
          bash scripts/verify-cargo.sh test-scoped -p herdr-core --lib ports::tests::cleanup_keeps_a_checkout_in_use_when_a_listener_starts_through_another_spelling -- --exact --nocapture || status=$?
          exit "$status"
      - uses: pnpm/action-setup@v6
        if: ${{ !cancelled() }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        id: web-deps
        if: ${{ !cancelled() }}
        run: bash scripts/verify-web.sh install --ignore-scripts
      - name: Web shell typecheck and unit suite, desktop app typecheck
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          bash scripts/verify-web.sh web typecheck
          bash scripts/verify-web.sh web lint
          bash scripts/verify-web.sh web test
          bash scripts/verify-web.sh desktop typecheck
          bash scripts/verify-web.sh desktop lint
      - name: Desktop app unit suite
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-web.sh desktop test
      - name: Build the Windows browser platform smoke
        id: platform-build
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          bash scripts/verify-web.sh web build
          bash scripts/verify-web.sh web playwright-install
      - name: Windows browser platform smoke
        if: ${{ !cancelled() && steps.herdr.outcome == 'success' && steps.platform-build.outcome == 'success' }}
        timeout-minutes: 20
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
          HIDE_E2E_TRACE: "1"
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          # A quarantined test leaves this required step as it leaves the
          # macOS one; the Linux lane's quarantine step still runs it.
          bash scripts/verify-web.sh web e2e --grep @platform --grep-invert @flaky
      - name: Keep the failed Windows platform run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hide-windows-platform-logs
          path: |
            ${{ runner.temp }}/hide-e2e
            web/test-results
          if-no-files-found: ignore

  # The web shell is the same code on every operating system, so the whole
  # suite runs once, on Linux, where runners are plentiful. What differs by
  # system is the daemon and Herdr under it, and the `@platform` tests cover
  # that on macOS.
  web-e2e:
    name: web e2e
    uses: ./.github/workflows/web-e2e.yml
    with:
      lane: linux
      runner: ubuntu-latest
      herdr-platform: linux-x86_64
      # Six shards: the suite is about 20 job-minutes of tests (a shard's
      # End-to-end step took 213-240 s at six and 131-182 s at eight,
      # 2026-10-01 runs 36896943318 and 36889286322) and every shard repeats
      # about a minute of setup. Six cost 29 shard job-minutes, 31 with the
      # build and zsh jobs, and the lane took 7.7 minutes from the build job's
      # start to the last shard, queueing aside; eight cost about 34 and no
      # less wall time, and four would cost about 25 and, estimated from the
      # same numbers, run about 10 minutes, past the 8-minute lane this
      # replaced. The organization runs 20 jobs at once, so fewer jobs per run
      # also queue less.
      shards: 6
      quarantine: true

  web-e2e-platform:
    name: web e2e (macOS)
    uses: ./.github/workflows/web-e2e.yml
    with:
      lane: macos
      runner: macos-15
      herdr-platform: macos-aarch64
      shards: 1
      grep: "@platform"

  # The OS contract's Linux and Windows legs (see os-contract.yml). Its macOS
  # leg runs in `desktop-e2e` below, on the runner that job already holds.
  os-contract:
    name: os contract
    uses: ./.github/workflows/os-contract.yml

  desktop-e2e:
    name: desktop e2e
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build hide and hided for the desktop app
        # hide-agent-hooks and hide-host-helper too: the home-layout spec
        # stages every binary the packaged app carries.
        run: bash scripts/verify-cargo.sh cli
      - name: Install dependencies
        run: bash scripts/verify-web.sh install
      - name: Install the pinned Electron runtime
        id: electron
        timeout-minutes: 5
        # Acquire once before the suite, preserving an upstream failure here.
        run: bash scripts/verify-web.sh desktop electron-install
      - name: Build the web shell
        # The desktop app serves web/dist through the hided it starts.
        run: bash scripts/verify-web.sh web build
      - name: Build hcoord
        # The staged app carries plugins/hcoord/dist, which the kit installs
        # at ~/.hide/hcoord; the home-layout spec stages it like a package.
        run: bash scripts/verify-web.sh hcoord build
      - name: Install Playwright Chromium
        # The browser spec opens a page in Chromium beside the Electron app.
        run: bash scripts/verify-web.sh desktop playwright-install
      - name: Fetch the pinned Herdr runtime
        id: herdr
        run: echo "bin=$(zsh scripts/fetch-herdr-runtime.sh)" >> "$GITHUB_OUTPUT"
      - name: Compare the binary schema and version with the pin on macOS
        run: python3 scripts/check-herdr-schema.py --herdr-bin "${{ steps.herdr.outputs.bin }}"
      - name: OS contract on macOS
        # The macOS leg of os-contract.yml, here because this job already
        # holds a macOS runner and the workspace build it needs.
        timeout-minutes: 10
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
        run: |
          bash scripts/verify-cargo.sh test-scoped -p hide-platform -p hide-herdr-client
          bash scripts/verify-cargo.sh test-scoped -p hide-herdr-client --test real_herdr -- --ignored --nocapture
      - name: Desktop app end-to-end
        # The desktop app against an isolated Herdr, starting its own hided
        # through the hide CLI built above. Electron downloads its runtime on
        # first launch outside CI; this lane acquires it once before the suite.
        timeout-minutes: 20
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          bash scripts/verify-web.sh desktop e2e --grep-invert @flaky
      - name: Quarantined tests (does not block verify)
        # A test tagged @flaky carries the issue that tracks its cause. It still
        # runs here, once, so a fix shows up as a pass and a regression of the
        # product it covers still shows up in the log; it cannot turn verify red.
        # A Rust test quarantined on macOS (`ignore = "<issue>"` under
        # `cfg_attr(target_os = "macos")`) runs here the same way.
        # The build is the required step's. `--no-deps` matters: a project
        # dependency runs whole whatever `--grep` says, so a `@needs-focus`
        # quarantined test would otherwise bring the entire background suite
        # with it.
        timeout-minutes: 10
        id: quarantine
        # Into its own output directory: Playwright empties its output directory
        # when a run starts, which would delete the required step's failure
        # snapshots.
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && steps.herdr.outcome == 'success' }}
        continue-on-error: true
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          status=0
          bash scripts/verify-cargo.sh test-scoped -p hide-platform -- --ignored || status=$?
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          bash scripts/verify-web.sh desktop e2e --no-deps --grep @flaky --output=test-results-quarantine || status=$?
          exit "$status"
      - name: Keep the e2e run's logs
        if: failure() || steps.quarantine.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: hide-desktop-e2e-logs
          path: |
            ${{ runner.temp }}/hide-e2e
            desktop/test-results
            desktop/test-results-quarantine
          if-no-files-found: ignore

  verify:
    name: verify
    needs: [rust, checks, web-e2e, web-e2e-platform, desktop-e2e, os-contract, windows-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every lane succeeded
        # A skipped or cancelled lane is a failure here; `needs` alone would
        # let one through.
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo 'a lane did not succeed:'; echo '${{ toJSON(needs) }}' | jq '.'; exit 1; }
