# Every pull request and every push to main runs this workflow, and nightly
# calls it; the single `verify` job is what branch protection requires. Adding
# a lane means adding it to `scripts/ci-plan.py`'s LANES and to `verify`'s
# `needs`; the protection rule never changes.
#
# The `plan` job classifies the paths a pull request changes into the lanes it
# needs (`scripts/ci-plan.py`; docs/TESTING.md, "Which lanes a pull request
# runs", owns the rules). Each lane runs when the plan names it, and `verify`
# passes only when every planned lane succeeded and every other lane was
# skipped, so a lane whose `if:` is wrong fails `verify` rather than passing
# it. A push to main, a comparison that cannot be computed, and a path no rule
# claims plan every lane; main's full run is the net under a lane a pull
# request left out. Nightly's call plans every lane too, and a lane it fails
# opens a `nightly-failure` issue, which a failed push run does not.
#
# A draft pull request runs the `plan` job and `verify` only: the lanes wait
# for the pull request to be marked ready for review, and `verify` fails with
# "draft: lanes not run" until then. It must fail rather than be skipped: a
# skipped required check counts as passed, and `verify` waits on the lanes, so
# right after the pull request is marked ready the draft run's skipped `verify`
# would be the only check on that commit and the pull request could merge before
# the ready run's lanes start. A failed `verify` blocks it until that run ends.
#
# Each gate here has a local command in CONTRIBUTING.md under "CI gates".
#
# Runner placement is a capacity decision. This organization's plan runs 20
# jobs at once and five of them on macOS across every repository, and on
# 2026-09-28 one run held all five for 26 minutes, so a second pull request
# waited up to 70 minutes before its lanes started. A pull request therefore
# asks for a macOS runner only for what a macOS runner alone proves: `desktop
# e2e` for a change to the desktop app or the web code it drives, `os
# contract (macos)` for a change to `hide-platform` or `hide-herdr-client`, and
# `package`'s macOS job for a change to what goes into a package, the one job
# that starts the packaged app such a change builds.
# Core and daemon changes run on Linux and Windows and leave the macOS
# `@platform` tests, the macOS mailbox lane and the rest of the OS contract to
# `nightly.yml`.
# Everything else runs on Linux: the Rust suite, the unit suites, the invariant
# checks, the whole web end-to-end, dealt out to four shards by `web-e2e.yml`,
# and the remote mailbox lane over private SSH (`remote-mailbox`).
# `nightly.yml` runs the web end-to-end's `@platform` tests on macOS, and the
# rest of the web end-to-end is the same code on every system, so the move of
# the web end-to-end costs no macOS coverage, only its delay. On Windows, `windows check`
# compiles the workspace and runs the daemon's and the app's suites there,
# beside the OS contract's Windows leg (issue #293), and `windows e2e` runs the
# browser `@platform` tests.
#
# Short jobs are merged because each job costs a runner start, a checkout and a
# place in the queue: one `checks` job runs the web shell's and the desktop
# app's typecheck, lint and unit suites, and `web-e2e.yml` fetches zsh in its
# build job and deals the shards from a fixed list. docs/TESTING.md counts the
# jobs of a run.
#
# A flaky test does not fail a lane. CI retries a failed test once, Playwright
# for the end-to-end suites and cargo-nextest for the Rust workspace; a test
# that passes the retry is flaky, the lane passes, and
# scripts/ci-flaky-report.py files it as an issue with a seven-day deadline
# (docs/TESTING.md, "Flaky tests"). A test that fails twice fails the lane.
#
# Every job and every long step has a timeout to bound a stalled required check.
name: verify

on:
  pull_request:
    # `ready_for_review` starts the run that plans and runs the lanes.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # nightly.yml runs every lane on main once a day.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request replaces that pull request's run. Main's runs
# are not cancelled once they start: each merge's full run is the net under the
# lanes a plan left out. GitHub keeps one pending run per group, so in a burst
# of merges a newer run replaces the pending one and checks their combined
# state. A called run takes its caller's name (`nightly`), so it never replaces
# a push run's place.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      full: ${{ steps.plan.outputs.full }}
      rust-packages: ${{ steps.plan.outputs.rust-packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base it merges into; the plan compares the two.
          fetch-depth: 2
      - name: Choose the lanes this change needs
        id: plan
        # The crate graph comes from `cargo metadata`, which needs no build.
        run: python3 scripts/ci-plan.py plan --event "$GITHUB_EVENT_NAME" --draft "${{ github.event.pull_request.draft || false }}"

  policy:
    name: policy checks
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'policy')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install zsh
        # The invariant scripts are zsh; the image has bash.
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Test the repository scripts, the lane plan included
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Structural checks
        run: |
          bash scripts/check-harness-ignore-anchor.sh
          bash scripts/check-agent-asset-committed.sh
          bash scripts/check-capability-readers-off-lock.sh
          bash scripts/check-no-workstation-identity.sh
          bash scripts/check-worktree-removal-boundary.sh
          zsh scripts/check-herdr-pin-single-source.sh

  rust:
    name: rust workspace
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'rust')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      FULL: ${{ needs.plan.outputs.full }}
      PACKAGES: ${{ needs.plan.outputs.rust-packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # A cache per pull request ref pushed the repository past the 10 GB
          # cache limit and evicted main's; main's is the one every run reads.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rustfmt and Clippy come with the version `rust-toolchain.toml` names,
      # which rustup installs on the job's first `rustc` or `cargo` call; the
      # image's own toolchain is never used. A full plan covers the whole
      # workspace; otherwise the plan names the changed crates and every crate
      # that depends on them.
      - name: Check formatting and lint the planned crates
        run: |
          if [ "$FULL" = true ]; then
            bash scripts/verify-cargo.sh lint
          else
            mapfile -t packages < <(jq -r '.[] | "-p", .' <<<"$PACKAGES")
            (( ${#packages[@]} )) || { echo 'the plan chose the rust lane but no crate' >&2; exit 1; }
            bash scripts/verify-cargo.sh fmt-check
            bash scripts/verify-cargo.sh clippy "${packages[@]}" --all-targets -- -D warnings
          fi
      - name: Install cargo-nextest
        # The pinned release build, so no compile. `.config/nextest.toml` holds
        # the `ci` profile: one retry, and a JUnit report.
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Test the planned crates
        # hide-ai drives its codex backend against a python fake app server.
        # nextest runs no doc test; the workspace has none that runs.
        run: |
          if [ "$FULL" = true ]; then
            bash scripts/verify-cargo.sh nextest --profile ci --workspace
          else
            mapfile -t packages < <(jq -r '.[] | "-p", .' <<<"$PACKAGES")
            (( ${#packages[@]} )) || { echo 'the plan chose the rust lane but no crate' >&2; exit 1; }
            bash scripts/verify-cargo.sh nextest --profile ci "${packages[@]}"
          fi
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml

  checks:
    name: web and desktop checks
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'checks')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        id: install
        run: bash scripts/verify-web.sh install
      - name: Web shell typecheck, lint, unit test, and build
        run: |
          bash scripts/verify-web.sh web typecheck
          bash scripts/verify-web.sh web lint
          bash scripts/verify-web.sh web test
          bash scripts/verify-web.sh web build
      - name: Desktop app typecheck, lint, and unit test
        # The menu is built from the web registry, so the plan brings this
        # lane for a registry change too. It stands on its own, so it runs
        # whatever the step above answered, but not after a failed install.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bash scripts/verify-web.sh desktop typecheck
          bash scripts/verify-web.sh desktop lint
          bash scripts/verify-web.sh desktop test

  # What differs on Windows (issue #293), as a required lane: the whole
  # workspace compiles for Windows, hided's pane bootstrap and end-to-end
  # tests pass there, `hide connect` starts and `hide stop` ends the hided
  # beside it (what the desktop app does first), the agent hook entries run
  # through PowerShell as Claude Code and Codex run them, hided drives the
  # pinned Herdr for Windows (a pane opened through `/ws` and a typed line
  # echoed back), and the web and desktop unit suites. Warm-cache jobs took
  # 4-8 minutes on 2026-10-03; a cold run compiles the workspace from
  # nothing. The browser `@platform` tests are `windows-e2e` below, so a change
  # that needs the compile does not also wait for a browser, and the reverse.
  windows-check:
    name: windows check
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'windows-check')
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    env:
      # Every Rust test step below names these same packages and targets and
      # picks its tests with `-E`, so cargo resolves features once and the
      # test binaries are built once, in `Build the Windows test binaries`.
      # When each step named only its own package, each resolved features
      # differently and rebuilt the crates under it: herdr-core compiled three
      # times and compiling took about 6 of the job's 11 minutes (2026-10-05).
      TEST_TARGETS: >-
        -p hided -p hide-host -p hide-kit -p hide-agent-hooks -p herdr-core -p hide-ai
        --lib --bin hide-agent-hooks
        --test opener_lifecycle --test connect_stop --test handshake --test real_herdr
        --test hook_deadline --test windows_hook_command --test claude_cli
    steps:
      - name: Keep line endings as committed
        # The runner converts to CRLF by default, which would make the unit
        # suites report line endings instead of code.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        # The Rust tests below run under nextest's `ci` profile (one retry).
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Compile the workspace for Windows
        run: bash scripts/verify-cargo.sh check --workspace --all-targets --keep-going --message-format short
      - name: Build the Windows test binaries
        id: tests
        # Built whatever the workspace check answered, so a compile error in
        # one target does not hide the tests that still build.
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS --no-run
      - name: hided's pane bootstrap, file opener, the device's workspace bridge, the CLI's daemon start and end-to-end tests
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hided) & kind(lib) & (test(pane_auth) | test(opener) | test(open_command) | test(workspace_cli))'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::opener_lifecycle)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-host) & kind(lib) & test(workspace_bridge)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::connect_stop)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::handshake)'
      - name: The weekly usage child's environment
        # The `/usage` child is started with a restricted environment, which
        # on Windows has to carry what Node and the CLI need to start, and the
        # reset time it prints is read through a tz database Windows lacks.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hide-ai::claude_cli) & test(usage::)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(herdr-core) & kind(lib) & (test(zoneinfo::) | test(usage::tests))'
      - name: Install kit and its Windows command shim
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-kit)'
      - name: Agent hooks, their Windows entries run through PowerShell
        # The hook file writer, the entries Claude Code and Codex run on
        # Windows, and the helper's stdin deadline. It stands on its own, so
        # it runs whatever the step above answered.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 15
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-agent-hooks)'
      - name: Fetch the pinned Herdr runtime
        id: herdr
        # The proof below stands on its own, so it runs whatever the step
        # above answered.
        if: ${{ !cancelled() }}
        # Assigned first, so a failed fetch fails this step rather than
        # handing the next one an empty path.
        run: |
          bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: hided against the pinned Herdr
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.herdr.outcome == 'success' }}
        timeout-minutes: 10
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::real_herdr)' --run-ignored only --no-capture
      - name: Attribute a native listening port to its working directory
        # Cleanup must refuse an unreadable in-use check. This unchanged core
        # contract exposes the native read reason that a browser error lacks.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          status=0
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(herdr-core) & kind(lib) & test(=ports::tests::a_real_listener_is_found_and_attributed_to_the_directory_it_runs_in)' --no-capture || status=$?
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(herdr-core) & kind(lib) & test(=ports::tests::cleanup_keeps_a_checkout_in_use_when_a_listener_starts_through_another_spelling)' --no-capture || status=$?
          exit "$status"
      - uses: pnpm/action-setup@v6
        if: ${{ !cancelled() }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        id: web-deps
        if: ${{ !cancelled() }}
        run: bash scripts/verify-web.sh install --ignore-scripts
      - name: Web shell typecheck and unit suite, desktop app typecheck
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          bash scripts/verify-web.sh web typecheck
          bash scripts/verify-web.sh web lint
          bash scripts/verify-web.sh web test
          bash scripts/verify-web.sh desktop typecheck
          bash scripts/verify-web.sh desktop lint
      - name: Desktop app unit suite
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-web.sh desktop test
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml

  # The browser `@platform` tests on Windows, the same set the macOS lane
  # runs, against hided and the pinned Herdr for Windows.
  windows-e2e:
    name: windows e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'windows-e2e')
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      lane: windows
      runner: windows-latest
      herdr-platform: windows-x86_64
      shards: 1
      grep: "@platform"

  # The web shell is the same code on every operating system, so the whole
  # suite runs once, on Linux, where runners are plentiful. What differs by
  # system is the daemon and Herdr under it, and the `@platform` tests cover
  # that: they run in this suite on Linux, in `windows-e2e` on Windows and in
  # `nightly.yml` on macOS.
  web-e2e:
    name: web e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'web-e2e')
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      lane: linux
      runner: ubuntu-latest
      herdr-platform: linux-x86_64
      # Four shards: the suite is about 20 job-minutes of tests and every
      # shard repeats about a minute of setup. Six shards ran 4.5 to 7.5
      # minutes each (2026-10-05) but 23 of 99 runs waited over 10 minutes for
      # a Linux shard, because the organization runs 20 jobs at once and a
      # full run asked for 23. Four shards put two fewer jobs in the queue; each
      # shard's time at four is measured after merge (docs/TESTING.md).
      shards: 4

  # The remote mailbox crate-boundary lane (herdr-core/tests/remote_delivery.rs,
  # docs/TESTING.md), in `remote-mailbox.yml`. It has its own job because it was
  # the tail of `web e2e (macOS)` (6.8 minutes of `@platform` tests, then 3.2 of
  # this lane after a 4.4-minute build of every CLI binary, 14.4 minutes in
  # all, the longest job of a run on 2026-10-05). It runs on Linux here: it
  # checks the SSH return route, helper attestation and the durable mailbox,
  # the same code on every system; what differs by system under it is
  # `os-contract`'s and `windows check`'s to prove. The fixture's macOS-only
  # branches (codesign of the staged binaries, BSD `ps` and `strip`, the SFTP
  # server path) and the Mac as the usual remote device are why `nightly.yml`
  # runs it on macOS too. It is planned for a change to the crates it builds
  # and tests (`MAILBOX_CRATES` in scripts/ci-plan.py).
  remote-mailbox:
    name: remote mailbox
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'remote-mailbox')
    uses: ./.github/workflows/remote-mailbox.yml
    permissions:
      contents: read
      issues: write
    with:
      runner: ubuntu-latest
      herdr-platform: linux-x86_64

  # The OS contract's Linux and Windows legs (see os-contract.yml), for any
  # change to what differs by system.
  os-contract:
    name: os contract
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'os-contract')
    uses: ./.github/workflows/os-contract.yml
    with:
      systems: '["linux","windows"]'
    permissions:
      contents: read
      issues: write

  # Its macOS leg, for a change to `hide-platform` or `hide-herdr-client` (and
  # a full plan); the nightly runs it for every other change.
  os-contract-macos:
    name: os contract (macOS)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'os-contract-macos')
    uses: ./.github/workflows/os-contract.yml
    with:
      systems: '["macos"]'
    permissions:
      contents: read
      issues: write

  desktop-e2e:
    name: desktop e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'desktop-e2e')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build hide and hided for the desktop app
        # hide-agent-hooks too, which the fixture's app bundle links beside
        # them, and hide-host-helper: the home-layout spec stages every binary
        # the packaged app carries.
        run: bash scripts/verify-cargo.sh cli
      - name: Install dependencies
        run: bash scripts/verify-web.sh install
      - name: Install the pinned Electron runtime
        id: electron
        timeout-minutes: 5
        # Acquire once before the suite, preserving an upstream failure here.
        run: bash scripts/verify-web.sh desktop electron-install
      - name: Build the web shell
        # The desktop app serves web/dist through the hided it starts.
        run: bash scripts/verify-web.sh web build
      - name: Install Playwright Chromium
        # The browser spec opens a page in Chromium beside the Electron app.
        run: bash scripts/verify-web.sh desktop playwright-install
      - name: Fetch the pinned Herdr runtime
        id: herdr
        run: echo "bin=$(zsh scripts/fetch-herdr-runtime.sh)" >> "$GITHUB_OUTPUT"
      - name: Compare the binary schema and version with the pin on macOS
        run: python3 scripts/check-herdr-schema.py --herdr-bin "${{ steps.herdr.outputs.bin }}"
      - name: Desktop app end-to-end
        # The desktop app against an isolated Herdr, starting its own hided
        # through the hide CLI built above. Electron downloads its runtime on
        # first launch outside CI; this lane acquires it once before the suite.
        timeout-minutes: 20
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          bash scripts/verify-web.sh desktop e2e
      - name: Report flaky and failed tests
        # A failed test is retried once; see web-e2e.yml.
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite desktop --playwright desktop/e2e-report.json
      - name: Keep the e2e run's logs
        # A flaky run keeps them as a failed one does; see web-e2e.yml.
        if: ${{ failure() || steps.flaky.outputs.flaky == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-desktop-e2e-logs
          path: |
            ${{ runner.temp }}/hide-e2e
            desktop/test-results
          if-no-files-found: ignore

  package:
    name: package
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'package')
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
    with:
      # A pull request's package reports a version no release uses.
      version: 0.0.0-ci.${{ github.run_number }}
      include-macos: true

  verify:
    name: verify
    needs: [plan, policy, rust, checks, os-contract, os-contract-macos, windows-check, windows-e2e, web-e2e, remote-mailbox, desktop-e2e, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-plan.py
          sparse-checkout-cone-mode: false
      - name: Every planned lane succeeded and every other lane was skipped
        # A planned lane that was skipped, cancelled or failed fails here, and
        # so does a lane that ran without being planned or a `needs` entry the
        # plan does not know.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py aggregate
