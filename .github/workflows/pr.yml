# Every pull request and every push to main runs the same three lanes, and the
# single `verify` job is what branch protection requires. Adding a lane means
# adding it to `verify`'s `needs`; the protection rule never changes.
#
# Each gate here has a local command in CONTRIBUTING.md under "CI gates".
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust workspace
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # The macos-15 image ships rustfmt and Clippy with its Rust toolchain.
      # The workspace is the core, the hide-ai provider boundary and the
      # context-label plugin; every lane covers all three.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint the workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the workspace
        # hide-ai drives its codex backend against a python fake app server.
        run: cargo test --locked --workspace

  swift:
    name: swift shell
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The tests build with the Xcode toolchain the runner ships. The
      # open-source 6.0.3 toolchain the release uses crashes in IRGen on a
      # debug build of MainWindowChrome.swift, which -O never reaches.
      #
      # `core` covers everything the release archive is built from, `shell`
      # everything SwiftPM compiles. Cargo decides freshness by mtime, which a
      # fresh checkout always fails, so the artifact worth caching is the
      # archive itself keyed by content: a Swift-only change hashes the same as
      # main and restores main's archive instead of rebuilding it.
      - name: Fingerprint the toolchains and the sources
        id: inputs
        run: |
          swift --version
          rustc --version
          {
            echo "rustc=$(rustc --version | cut -d' ' -f2)"
            echo "core=${{ hashFiles('Cargo.lock', 'Cargo.toml', 'contracts/**', 'herdr-core/**', 'hided/**', 'hide-*/**', 'plugins/agent-context-labels/**') }}"
            echo "shell=${{ hashFiles('macos/**', '!macos/.build/**', '!macos/build/**') }}"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the core archive built from these sources
        id: core-archive
        uses: actions/cache@v6
        with:
          path: target/release/libherdr_core.a
          key: core-archive-${{ runner.os }}-${{ steps.inputs.outputs.rustc }}-${{ steps.inputs.outputs.core }}
      - uses: Swatinem/rust-cache@v2
        if: steps.core-archive.outputs.cache-hit != 'true'
        with:
          workspaces: ". -> target"
      - name: Build the core archive the shell links
        if: steps.core-archive.outputs.cache-hit != 'true'
        run: bash scripts/verify-cargo.sh build
      - name: Link the restored archive without a Cargo run
        if: steps.core-archive.outputs.cache-hit == 'true'
        run: echo "HIDE_CORE_ARCHIVE_PREBUILT=1" >> "$GITHUB_ENV"
      # The key carries every Swift input so each run with a change saves a
      # newer build; an exact hit saves nothing, and a key on Package.swift
      # alone kept restoring the build from the last manifest change.
      - uses: actions/cache@v6
        with:
          path: macos/.build
          key: swift-build-${{ runner.os }}-${{ steps.inputs.outputs.shell }}-${{ steps.inputs.outputs.core }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ steps.inputs.outputs.shell }}-
            swift-build-${{ runner.os }}-
      - name: Test the shell
        run: bash scripts/verify-swift.sh test
      - name: Assert the shell's user-facing contracts
        # Both scripts pair a targeted test with a source search no test can
        # perform; the search half is what the full suite above does not cover.
        run: |
          bash scripts/check-right-panel-sections.sh
          bash scripts/check-shortcut-contract.sh

  scripts:
    name: repository invariants
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test performance measurement semantics
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Structural checks
        run: |
          bash scripts/check-harness-ignore-anchor.sh
          bash scripts/check-agent-asset-committed.sh
          python3 scripts/check-core-bridge-structure.py
          bash scripts/check-capability-readers-off-lock.sh
          bash scripts/check-terminal-row-cache.sh
          bash scripts/check-packaged-resource-access.sh
          bash scripts/check-no-workstation-identity.sh
          bash scripts/check-git-worktree-presentation.sh
          bash scripts/check-git-worktree-states.sh
          bash scripts/check-worktree-base-policy.sh
          bash scripts/check-worktree-catalog-presentation.sh
          bash scripts/check-worktree-removal-boundary.sh
          zsh scripts/check-herdr-pin-single-source.sh
      - name: Fetch the pinned Herdr runtime
        id: herdr
        # The manifest is the pin; the download is verified against its digest
        # before the binary answers anything.
        run: |
          manifest=macos/Sources/HerdrMacOS/Resources/herdr-bundle.json
          url="$(jq -er .source_url "$manifest")"
          expected="$(jq -er .sha256 "$manifest")"
          curl -sSfL "$url" -o "$RUNNER_TEMP/herdr"
          actual="$(shasum -a 256 "$RUNNER_TEMP/herdr" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "pinned Herdr digest mismatch: $actual" >&2; exit 1; }
          chmod +x "$RUNNER_TEMP/herdr"
          echo "bin=$RUNNER_TEMP/herdr" >> "$GITHUB_OUTPUT"
      - name: Compare the Herdr API schema with the contract
        run: zsh scripts/check-herdr-contract.sh --herdr-bin "${{ steps.herdr.outputs.bin }}" --schema-only

  web:
    name: web shell
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build hided for Playwright
        run: bash -lc 'source scripts/toolchain-env.sh && cargo build --locked -p hided'
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck, lint, and unit test
        run: |
          pnpm --dir web typecheck
          pnpm --dir web lint
          pnpm --dir web test
      - name: Build the web shell
        run: pnpm --dir web build
      - name: Install Playwright Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: End-to-end
        run: pnpm --dir web exec playwright test

  verify:
    name: verify
    needs: [rust, swift, scripts, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every lane succeeded
        # A skipped or cancelled lane is a failure here; `needs` alone would
        # let one through.
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo 'a lane did not succeed:'; echo '${{ toJSON(needs) }}' | jq '.'; exit 1; }
