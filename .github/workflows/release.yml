name: hide release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test the workspace
        run: bash scripts/verify-cargo.sh test
      - name: Typecheck, lint, unit test and build the web shell and the desktop app
        run: bash scripts/verify-web.sh

  macos-arm64:
    # A tag builds a release only from a tree both suites passed.
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Package the ad-hoc signed app and its checksum
        # The version is the tag; the packager builds the release binaries,
        # fetches the pinned Herdr and refuses when any of them cannot run.
        run: HIDE_VERSION="${GITHUB_REF_NAME#v}" pnpm --dir desktop package
      - name: Verify the release archive
        run: |
          test -s desktop/out/*.zip
          test -s desktop/out/*.zip.sha256
          (cd desktop/out && shasum -a 256 -c ./*.zip.sha256)
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: |
            desktop/out/*.zip
            desktop/out/*.zip.sha256
