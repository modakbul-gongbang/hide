name: hide release

# A `v*` tag builds every package from a tree both suites passed, and one job
# drafts one release with all of them: the ad-hoc signed macOS app, and the
# unsigned Windows and Linux packages `package.yml` builds and starts on their
# own runners. Each upload is a workflow artifact first, so a failed package
# drafts nothing and no two jobs race to create the same draft.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a stable tag already on protected main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test the workspace
        run: bash scripts/verify-cargo.sh test
      - name: Typecheck, lint, unit test and build the web shell and the desktop app
        run: bash scripts/verify-web.sh

  macos-arm64:
    # A tag builds a release only from a tree both suites passed.
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Package the ad-hoc signed app and its checksum
        # The version is the tag; the packager builds the release binaries,
        # fetches the pinned Herdr and refuses when any of them cannot run.
        run: HIDE_VERSION="${GITHUB_REF_NAME#v}" pnpm --dir desktop package
      - name: Verify the release archive
        run: |
          test -s desktop/out/*.zip
          test -s desktop/out/*.zip.sha256
          (cd desktop/out && shasum -a 256 -c ./*.zip.sha256)
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: hide-package-macos
          path: |
            desktop/out/*.zip
            desktop/out/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows-linux:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}

  draft:
    needs: [macos-arm64, windows-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: hide-package-*
          path: packages
          merge-multiple: true
      - name: Read existing release without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p agents/runs/release
          status=$(curl --silent --show-error --output agents/runs/release/existing.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$status" in
            200) ;;
            404) printf 'null\n' > agents/runs/release/existing.json ;;
            *) printf 'Release lookup failed with HTTP %s\n' "$status" >&2; exit 1 ;;
          esac
      - name: Require this version of all three targets and an unpublished draft
        run: node scripts/check-release-assets.mjs "$GITHUB_REF_NAME" packages agents/runs/release/existing.json
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: packages/*
