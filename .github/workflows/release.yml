name: hide release

# A `v*` tag builds every package from a tree both suites passed, and one job
# drafts one release with all of them: the notarized macOS app, and the
# unsigned Windows and Linux packages `package.yml` builds and starts on their
# own runners. Each upload is a workflow artifact first, so a failed package
# drafts nothing and no two jobs race to create the same draft.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a stable tag already on protected main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test the workspace
        run: bash scripts/verify-cargo.sh test
      - name: Typecheck, lint, unit test and build the web shell and the desktop app
        run: bash scripts/verify-web.sh

  macos-arm64:
    # A tag builds a release only from a tree both suites passed.
    needs: test
    runs-on: macos-15
    # The Developer ID certificate and the notary key are secrets of this
    # environment, so no other job or workflow can read them.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the Developer ID certificate and the notary key
        # The certificate goes into a keychain of this job's own, put on the
        # search list so codesign finds it; the step names the one Developer
        # ID Application identity in it rather than trusting a typed name.
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(Developer ID Application: .*\)"$/\1/p')"
          if [ "$(printf '%s' "$identity" | grep -c '^')" != 1 ]; then
            echo "::error::the certificate must hold exactly one Developer ID Application identity"
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          echo "HIDE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "HIDE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - name: Package, sign and notarize the app and its checksum
        # The version is the tag; the packager builds the release binaries,
        # fetches the pinned Herdr and refuses when any of them cannot run,
        # then fails unless Gatekeeper accepts the archived app as notarized.
        timeout-minutes: 90
        env:
          HIDE_MACOS_SIGNING: developer-id
          HIDE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          HIDE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: HIDE_VERSION="${GITHUB_REF_NAME#v}" pnpm --dir desktop package
      - name: Verify the release archive
        run: |
          test -s desktop/out/*.zip
          test -s desktop/out/*.zip.sha256
          (cd desktop/out && shasum -a 256 -c ./*.zip.sha256)
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: hide-package-macos
          path: |
            desktop/out/*.zip
            desktop/out/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"

  windows-linux:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}

  draft:
    needs: [macos-arm64, windows-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: hide-package-*
          path: packages
          merge-multiple: true
      - name: Prepare an exact draft with append-only assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA" packages
