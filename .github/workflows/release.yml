name: hide release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show the Swift toolchain
        run: swift --version
      - name: Test the core
        run: cargo test --locked --manifest-path herdr-core/Cargo.toml
      - name: Build the core archive the shell links
        run: cargo build --release --locked -p herdr-core
      - name: Test the shell
        run: swift test --package-path macos

  macos-arm64:
    # A tag builds a release only from a tree both suites passed.
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Swift 6 toolchain
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.0.3"
      - name: Show Swift toolchain
        run: swift --version
      - name: Build signed ad-hoc bundle and checksums
        run: HIDE_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Verify release archive
        run: |
          test -s dist/*.zip
          test -s dist/*.zip.sha256
          (cd dist && shasum -a 256 -c ./*.zip.sha256)
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: |
            dist/*.zip
            dist/*.zip.sha256
