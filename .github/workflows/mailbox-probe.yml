# PROBE, not for merge: runs only the remote mailbox lane on Linux when a probe branch is pushed.
name: mailbox probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: web-e2e-mailbox
          save-if: false
      - name: Install zsh and the SFTP server
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          sudo apt-get install -y --no-install-recommends zsh openssh-sftp-server
      - run: bash scripts/install-nextest.sh
      - run: bash scripts/verify-cargo.sh cli
      - name: Fetch the pinned Herdr runtime
        id: herdr
        run: |
          bin=$(zsh scripts/fetch-herdr-runtime.sh --platform linux-x86_64)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Show the staged sizes
        run: ls -la target/debug/hide target/debug/hided target/debug/hide-agent-hooks target/debug/hide-host-helper
      - name: Remote mailbox over private SSH
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
        run: bash scripts/verify-cargo.sh nextest --profile ci -p herdr-core --test remote_delivery --run-ignored only --success-output immediate
      - name: Keep the run directory
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs
          include-hidden-files: true
          path: |
            agents/runs/rd-*
            !agents/runs/rd-*/cli/**
            !agents/runs/rd-*/*/*/.ssh/**
          if-no-files-found: ignore
