[package]
name = "herdr-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "herdr_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "=1.0.104"
hide-agent-hooks = { path = "../hide-agent-hooks" }
hide-ai = { path = "../hide-ai" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-host = { path = "../hide-host" }
hide-memory = { path = "../hide-memory" }
hide-project = { path = "../hide-project" }
hide-session = { path = "../hide-session" }
base64 = "=0.23.1"
cap-std = "=4.0.3"
libc = "=0.2.189"
regress = "=0.12.0"
regex = "=1.13.1"
russh = { version = "=0.63.2", default-features = false, features = ["ring", "rsa"] }
russh-config = "=0.58.0"
russh-sftp = "=2.4.0"
schemars = { version = "=0.8.22", features = ["preserve_order"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tempfile = "=3.27.0"
trash = { version = "=5.2.8", default-features = false }
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
