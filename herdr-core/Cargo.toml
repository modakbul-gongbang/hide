[package]
name = "herdr-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "herdr_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "=0.22.1"
portable-pty = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
