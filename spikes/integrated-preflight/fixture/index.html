<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herdr CEF fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111317;
        color: #f4f5f7;
      }
      body {
        max-width: 720px;
        margin: 72px auto;
        padding: 0 24px;
      }
      label,
      input,
      button,
      output {
        display: block;
        font: inherit;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin: 12px 0;
        padding: 12px;
        color: inherit;
        background: #1b1f26;
        border: 1px solid #3b4350;
        border-radius: 8px;
      }
      button {
        padding: 10px 14px;
        color: #0d1117;
        background: #8bd5ca;
        border: 0;
        border-radius: 8px;
        font-weight: 600;
      }
      output {
        margin-top: 20px;
        color: #a6da95;
      }
    </style>
  </head>
  <body>
    <h1>CEF native child fixture</h1>
    <p>This page uses synthetic data only.</p>
    <label for="note">Persistent note</label>
    <input id="note" autocomplete="off" placeholder="한글 입력 확인" />
    <button id="save" type="button">Save fixture state</button>
    <output id="status" aria-live="polite"></output>
    <script>
      const note = document.querySelector("#note");
      const status = document.querySelector("#status");
      const saved = localStorage.getItem("herdr-cef-probe-note") || "";
      note.value = saved;
      status.value = saved ? `Restored: ${saved}` : "Ready";
      document.querySelector("#save").addEventListener("click", () => {
        localStorage.setItem("herdr-cef-probe-note", note.value);
        status.value = `Saved: ${note.value}`;
      });
    </script>
  </body>
</html>
