[package]
name = "herdr-cef-probe"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.cef.bundle]
helper_name = "herdr-cef-probe-helper"

[[bin]]
name = "herdr-cef-probe"
path = "src/main.rs"

[[bin]]
name = "herdr-cef-probe-helper"
path = "src/bin/herdr_cef_probe_helper.rs"

[[bin]]
name = "bundle-probe"
path = "src/bin/bundle_probe.rs"

[dependencies]
cef = { version = "=151.8.0+151.3.24", features = ["build-util", "sandbox"] }
semver = "1.0.27"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", features = [
  "NSApplication",
  "NSEvent",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
