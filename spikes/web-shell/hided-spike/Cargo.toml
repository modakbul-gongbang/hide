[package]
name = "hided-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "hided-spike"
path = "src/main.rs"

[dependencies]
herdr-core = { path = "../../../herdr-core" }
axum = { version = "=0.8.8", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.dev]
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
